items:
  - phase: THE BEGINNING
    date: October 2020
    description: Joined RaftLabs as its first engineer. No codebase, no standards, no team.
  - phase: THE BUILDING
    date: 2020-2022
    description: Chose the stack (React, Node, Hasura, AWS Lambda) and set the coding standards and CI that every RaftLabs project still runs on.
  - phase: THE SCALING
    date: 2022-2024
    description: Team grew 1 → 30+. Mentored 10+ engineers and led 3–5 person teams on client systems.
  - phase: THE IMPACT
    date: 2024-Present
    description: 1M+ users served. 10,000 events/minute processed. Sync times cut 97%. RaftStack adopted by all 30+ engineers.
